name: Build Firmware
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build and merge firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.3
          target: esp32c3
          command: >-
            pip install Pillow &&
            idf.py build &&
            cd build &&
            sed -i 's/--flash_size detect/--flash_size 8MB/g' flash_args &&
            esptool.py --chip esp32c3 merge_bin
            --flash_mode dio --flash_size 8MB --flash_freq 80m
            -o passport-xiaozhi-full.bin
            @flash_args
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: passport-xiaozhi-firmware
          path: build/passport-xiaozhi-full.bin
          if-no-files-found: error
