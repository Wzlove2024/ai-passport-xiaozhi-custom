name: Build Firmware
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build and merge firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.3
          target: esp32c3
          command: pip install Pillow && idf.py build && esptool.py --chip esp32c3 merge_bin --flash_mode dio --flash_size 8MB --flash_freq 80m -o build/passport-xiaozhi-full.bin 0x0 build/bootloader/bootloader.bin 0x8000 build/partition_table/partition-table.bin 0x10000 build/trae_card.bin 0x3fa000 build/imgava.bin 0x500000 build/petart.bin 0x600000 build/companion/companion.bin
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: passport-xiaozhi-firmware
          path: build/passport-xiaozhi-full.bin
          if-no-files-found: error
